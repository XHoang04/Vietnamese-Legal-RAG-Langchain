[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legalrag"
version = "0.1.0"
description = "Agentic Legal RAG for Vietnamese labor law using LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Project RAG Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "orjson>=3.10.0",
    "tenacity>=8.3.0",
    "numpy>=1.26.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
data = [
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "sqlalchemy>=2.0.0",
    "datasets>=2.19.0",
]
retrieval = [
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
]
pdf = [
    "pymupdf>=1.24.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]
ui = [
    "streamlit>=1.35.0",
]
eval = [
    "ragas>=0.1.0",
]
llm-google = [
    "langchain-google-genai>=1.0.0",
]
llm-groq = [
    "langchain-groq>=0.1.0",
]
llm-openai = [
    "langchain-openai>=0.1.0",
]
llm-ollama = [
    "langchain-ollama>=0.1.0",
]

[project.scripts]
legalrag = "legalrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "model: marks tests that require real models or downloads",
]
