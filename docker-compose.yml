version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: legalrag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legalrag-api
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - API_KEYS=${API_KEYS:-dev-key-1}
      - LEGALRAG__APP__QDRANT__URL=http://qdrant:6333
      - LEGALRAG__APP__DB__URL=sqlite:///data/processed/legalrag.db
      - LLM_PROFILE=${LLM_PROFILE:-api_dev}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legalrag-ui
    command: streamlit run apps/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - LEGALRAG_API_URL=http://api:8000
      - API_KEYS=${API_KEYS:-dev-key-1}
    depends_on:
      - api

volumes:
  qdrant_storage:
