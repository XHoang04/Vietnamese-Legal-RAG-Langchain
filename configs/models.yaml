profiles:
  api_dev:
    default:
      provider: "${LLM_PROVIDER:-google_genai}"
      model: "${LLM_MODEL:-gemini-1.5-flash}"
      temperature: 0.0
      max_tokens: 1024
      timeout_s: 60
      rpm: "${LLM_RPM:-10}"
    roles:
      generator:
        temperature: 0.1
        max_tokens: 1500
      judge:
        provider: "${JUDGE_PROVIDER:-google_genai}"
        model: "${JUDGE_MODEL:-gemini-1.5-pro}"
  private:
    default:
      provider: "ollama"
      model: "${OLLAMA_MODEL:-qwen2.5:7b}"
      base_url: "${OLLAMA_BASE_URL:-http://localhost:11434}"
      temperature: 0.0
      max_tokens: 1024

embeddings:
  default:
    model: "AITeamVN/Vietnamese_Embedding"
    dim: 1024
    max_length: 2048
    query_prefix: ""
    doc_prefix: ""

reranker:
  default:
    model: "AITeamVN/Vietnamese_Reranker"
    max_length: 1024
    batch_size: 8
